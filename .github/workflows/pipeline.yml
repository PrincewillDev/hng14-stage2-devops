name: CI/CD Pipeline

on:
  push:
  pull_request:

env:
  REGISTRY: localhost:5000

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python lint (flake8)
        run: |
          pip install flake8
          flake8 api/main.py worker/worker.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS lint (eslint)
        working-directory: frontend
        run: |
          npm install
          npx eslint app.js

      - name: Dockerfile lint — api (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Dockerfile lint — worker (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile

      - name: Dockerfile lint — frontend (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run tests with coverage
        working-directory: api
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/htmlcov/
          retention-days: 7

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set SHA tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & push api
        run: |
          docker build \
            -t $REGISTRY/api:${{ steps.tag.outputs.sha }} \
            -t $REGISTRY/api:latest \
            ./api
          docker push $REGISTRY/api:${{ steps.tag.outputs.sha }}
          docker push $REGISTRY/api:latest

      - name: Build & push worker
        run: |
          docker build \
            -t $REGISTRY/worker:${{ steps.tag.outputs.sha }} \
            -t $REGISTRY/worker:latest \
            ./worker
          docker push $REGISTRY/worker:${{ steps.tag.outputs.sha }}
          docker push $REGISTRY/worker:latest

      - name: Build & push frontend
        run: |
          docker build \
            -t $REGISTRY/frontend:${{ steps.tag.outputs.sha }} \
            -t $REGISTRY/frontend:latest \
            ./frontend
          docker push $REGISTRY/frontend:${{ steps.tag.outputs.sha }}
          docker push $REGISTRY/frontend:latest

      - name: Save images as tarballs
        run: |
          docker save $REGISTRY/api:latest      | gzip > /tmp/api.tar.gz
          docker save $REGISTRY/worker:latest   | gzip > /tmp/worker.tar.gz
          docker save $REGISTRY/frontend:latest | gzip > /tmp/frontend.tar.gz

      - name: Upload image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/*.tar.gz
          retention-days: 1

  # ── 4. Security scan ───────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Load images
        run: |
          docker load < /tmp/images/api.tar.gz
          docker load < /tmp/images/worker.tar.gz
          docker load < /tmp/images/frontend.tar.gz

      - name: Scan api with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/api:latest
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL
          exit-code: "0"

      - name: Scan worker with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/worker:latest
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL
          exit-code: "0"

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: "0"

      - name: Upload SARIF results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: trivy-*.sarif
          retention-days: 7

      - name: Fail on CRITICAL findings
        run: |
          FAILED=0
          for f in trivy-api.sarif trivy-worker.sarif trivy-frontend.sarif; do
            COUNT=$(jq '[.runs[].results[] | select(.message.text | contains("Severity: CRITICAL"))] | length' "$f")
            if [ "$COUNT" -gt 0 ]; then
              echo "CRITICAL vulnerabilities found in $f: $COUNT finding(s)"
              echo "--- Details ---"
              jq -r '
                .runs[].results[]
                | select(.message.text | contains("Severity: CRITICAL"))
                | "CVE: \(.ruleId)  PKG: \(.locations[0].physicalLocation.artifactLocation.uri // "n/a")  MSG: \(.message.text)"
              ' "$f"
              FAILED=1
            fi
          done
          exit $FAILED

  # ── 5. Integration test ────────────────────────────────────────────────────
  integration-test:
    name: Integration Test
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create compose .env
        run: |
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" > .env
          echo "APP_ENV=production"   >> .env
          echo "FRONTEND_PORT=3000"   >> .env

      - name: Download image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Load images
        run: |
          docker load < /tmp/images/api.tar.gz
          docker load < /tmp/images/worker.tar.gz
          docker load < /tmp/images/frontend.tar.gz

      - name: Bring full stack up
        run: docker compose up -d

      - name: Wait for frontend to be ready
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:3000/ > /dev/null; do sleep 3; done'

      - name: Submit a job through the frontend
        id: submit
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:3000/submit)
          echo "response=$RESPONSE"
          JOB_ID=$(echo "$RESPONSE" | jq -r '.job_id')
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT

      - name: Poll until job completes (max 60s)
        run: |
          JOB_ID="${{ steps.submit.outputs.job_id }}"
          timeout 60 bash -c "
            until [ \"\$(curl -sf http://localhost:3000/status/$JOB_ID | jq -r '.status')\" = 'completed' ]; do
              sleep 2
            done
          "

      - name: Assert final status is completed
        run: |
          STATUS=$(curl -sf http://localhost:3000/status/${{ steps.submit.outputs.job_id }} | jq -r '.status')
          echo "Final status: $STATUS"
          [ "$STATUS" = "completed" ] || { echo "Expected 'completed', got '$STATUS'"; exit 1; }

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ── 6. Deploy (main only) ──────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rolling update via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: false
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest source and build images locally
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose build

            # Ensure Redis is running (stateful — no rolling update needed)
            # Must start BEFORE rolling out api/worker since they depend on it
            sudo docker compose up -d redis

            # Wait for Redis to be healthy
            echo "==> Waiting for Redis to be healthy..."
            REDIS_DEADLINE=$(($(date +%s) + 60))
            while [ "$(date +%s)" -lt "$REDIS_DEADLINE" ]; do
              REDIS_ID=$(sudo docker compose ps -q redis)
              REDIS_HEALTH=$(sudo docker inspect -f '{{.State.Health.Status}}' "$REDIS_ID" 2>/dev/null || echo "unknown")
              if [ "$REDIS_HEALTH" = "healthy" ]; then
                echo "Redis is healthy"
                break
              fi
              sleep 3
            done

            if [ "$REDIS_HEALTH" != "healthy" ]; then
              echo "Redis failed to become healthy — aborting deploy"
              exit 1
            fi

            # Roll each stateless service individually
            for SERVICE in api worker frontend; do
              echo "==> Rolling update: $SERVICE"

              # Capture existing container IDs for this service
              sudo docker compose ps -q "$SERVICE" 2>/dev/null > /tmp/old_ids.txt || true
              OLD_COUNT=$(wc -l < /tmp/old_ids.txt)
              OLD_ID=$(head -1 /tmp/old_ids.txt)

              if [ -z "$OLD_ID" ]; then
                # First deploy — no rolling needed
                sudo docker compose up -d --no-deps "$SERVICE"
                echo "$SERVICE started (first deploy)"
                continue
              fi

              echo "Old container: $OLD_ID"

              # Scale up preserving the old container (--no-recreate keeps old ID stable)
              sudo docker compose up -d --no-deps --no-recreate --scale "${SERVICE}=$((OLD_COUNT + 1))" "$SERVICE"
              sleep 5

              # Identify the new container (ID not in the pre-scale list)
              NEW_ID=$(sudo docker compose ps -q "$SERVICE" 2>/dev/null | grep -vxFf /tmp/old_ids.txt | head -1)
              echo "New container: $NEW_ID"

              if [ -z "$NEW_ID" ] || [ "$NEW_ID" = "$OLD_ID" ]; then
                echo "Failed to identify new container for $SERVICE"
                exit 1
              fi

              # Wait up to 60 seconds for health check to pass
              HEALTHY=false
              DEADLINE=$(($(date +%s) + 60))

              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                HEALTH=$(sudo docker inspect -f \
                  '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                  "$NEW_ID" 2>/dev/null || echo "unknown")

                if [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "none" ]; then
                  HEALTHY=true
                  break
                fi
                sleep 3
              done

              if [ "$HEALTHY" = "true" ]; then
                sudo docker stop "$OLD_ID" && sudo docker rm "$OLD_ID" || true
                sudo docker compose up -d --no-deps --no-recreate --scale "${SERVICE}=1" "$SERVICE" || true
                echo "$SERVICE updated successfully"
              else
                sudo docker stop "$NEW_ID" && sudo docker rm "$NEW_ID" || true
                echo "Health check timed out for $SERVICE — old container preserved, aborting"
                exit 1
              fi
            done

            echo "==> Deploy complete"