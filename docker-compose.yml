services:

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - internal
    # intentionally no ports: block — Redis must not be exposed on the host
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: "0.50"
    mem_limit: 128M

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENV: ${APP_ENV}
    networks:
      - internal
      - frontend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.50"
    mem_limit: 256M

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENV: ${APP_ENV}
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    cpus: "0.50"
    mem_limit: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_HOST: api
      APP_ENV: ${APP_ENV}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.50"
    mem_limit: 256M

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
